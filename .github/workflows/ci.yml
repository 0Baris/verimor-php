name: PHP CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: php-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ["7.4", "8.0", "8.1", "8.2", "8.3", "8.4", "8.5"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:2.10.3
          coverage: none
      - run: composer validate --strict
      - run: composer install --prefer-dist --no-interaction
      - run: composer check
      - run: >-
          vendor/bin/phpunit --fail-on-warning --fail-on-risky
          --fail-on-skipped --fail-on-incomplete
      - run: python3 scripts/run_examples.py php

  package-consumer:
    needs: [quality]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.5"
          tools: composer:2.10.3
          coverage: none
      - run: composer install --prefer-dist --no-interaction
      - run: vendor/bin/phpunit tests/Contract/PackageContentsTest.php
      - run: php scripts/build-archive.php build/dist
      - run: php scripts/test-consumer.php build/dist/*.zip
