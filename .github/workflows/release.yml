name: Release PHP SDK

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["7.4", "8.0", "8.1", "8.2", "8.3", "8.4", "8.5"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@44454db4f0199b8b9685a5d763dc37cbf79108e1 # 2.36.0
        with:
          php-version: ${{ matrix.php }}
          tools: composer:2.10.3
          coverage: none
      - run: composer validate --strict
      - run: composer install --prefer-dist --no-interaction
      - run: composer check
      - run: >-
          vendor/bin/phpunit --fail-on-warning --fail-on-risky
          --fail-on-skipped --fail-on-incomplete

  build:
    needs: [quality]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@44454db4f0199b8b9685a5d763dc37cbf79108e1 # 2.36.0
        with:
          php-version: "8.5"
          tools: composer:2.10.3
          coverage: none
      - run: php scripts/check-version.php "${GITHUB_REF_NAME}"
      - run: composer install --prefer-dist --no-interaction
      - run: vendor/bin/phpunit tests/Contract/PackageContentsTest.php
      - run: php scripts/build-archive.php build/dist
      - run: php scripts/test-consumer.php build/dist/*.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verimor-php-${{ github.ref_name }}
          path: build/dist/*.zip
          if-no-files-found: error

  github-release:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: verimor-php-${{ github.ref_name }}
          path: release
      - env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" release/*.zip
          --verify-tag --title "Verimor PHP SDK ${GITHUB_REF_NAME}"
          --notes-file CHANGELOG.md
